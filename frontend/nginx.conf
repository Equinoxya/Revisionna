# Si un proxy HTTPS est placé devant (Caddy, Traefik…), il annonce le protocole
# d'origine : on le transmet à l'API, qui marque alors ses cookies « Secure ».
map $http_x_forwarded_proto $proto_origine {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Aucune requête légitime n'approche cette taille.
    client_max_body_size 256k;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Fichiers produits par Vite : leur nom change avec leur contenu, ils
    # peuvent donc rester en cache très longtemps.
    location /assets/ {
        include /etc/nginx/snippets/securite.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # L'API : relayée vers le service Flask, qui pose ses propres en-têtes.
    location /api/ {
        # Résolution par le DNS interne de Docker à chaque requête : nginx
        # démarre même si l'API n'est pas encore là, et la retrouve si elle
        # redémarre avec une autre adresse.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api http://api:5000;
        proxy_pass $api;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proto_origine;
        proxy_read_timeout 75s;
    }

    # Application monopage : toute autre adresse retombe sur index.html.
    location / {
        include /etc/nginx/snippets/securite.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
