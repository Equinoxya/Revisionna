# En-têtes de sécurité des pages et des fichiers statiques.
# À inclure dans CHAQUE bloc `location` qui utilise `add_header` : dans nginx,
# un bloc qui en déclare n'hérite plus de ceux du niveau supérieur.

# Rien ne se charge ni ne s'exécute hors de ce site : pas de script en ligne,
# pas de ressource tierce, pas d'affichage dans une autre page.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; media-src 'self' https:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Les navigateurs n'en tiennent compte qu'en HTTPS ; en HTTP il est ignoré.
add_header Strict-Transport-Security "max-age=31536000" always;
