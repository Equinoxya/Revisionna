name: CI

on:
  push:
    branches: ["main", "stagiaire/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Installer les dependances
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        working-directory: backend
        run: ruff check .

      - name: Tests (pytest)
        working-directory: backend
        run: pytest --cov=app --cov-report=term-missing

  content:
    name: Contenu pedagogique (solutions de reference)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - working-directory: backend
        run: pip install -r requirements-dev.txt

      # Garde-fou : chaque solution d'exercice doit passer ses propres tests.
      - name: Verifier les solutions
        working-directory: backend
        run: python scripts/verifier_contenu.py

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - working-directory: frontend
        run: npm ci

      - name: Lint (eslint)
        working-directory: frontend
        run: npm run lint

      - name: Build (vite)
        working-directory: frontend
        run: npm run build

  images:
    name: Images Docker
    runs-on: ubuntu-latest
    needs: [backend, frontend, content]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Construire l'image du backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: revisionna-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Construire l'image du frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: revisionna-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
